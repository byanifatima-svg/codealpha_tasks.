<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="display"></div>
        <div class="btn" id="btns">
            <button class="clear" style="font-size: 19px;">AC</button>
            <button class="delete" style="font-size: 17px;">DEL</button>
            <button>%</button>
            <button>/</button> <br>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button> <br>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button> <br>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="plas">+</button> <br>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button>=</button> <br>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
